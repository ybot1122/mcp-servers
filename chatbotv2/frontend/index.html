<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>League Assist</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="chat-shell">
        <section class="header">
            <h1>League Assist</h1>
            <div id="gameAudio">
                <button id="welcome_play">
                    Play Welcome Message
                </button>
            </div>
        </section>

        <section class="state-panel" id="statePanel">
            <div class="state-header">
                <div>
                    <h2>Live Game State</h2>
                    <p>Polling the League client every second for champions, summoner names, items, and KDA.</p>
                    <div class="active-player-info" id="activePlayerInfo">Active player: unknown</div>
                </div>
                <div class="state-meta" id="stateMeta">No game has started yet.</div>
            </div>

            <div class="team-grid">
                <div class="team-column">
                    <h3>My Team</h3>
                    <div class="player-list" id="teamA"></div>
                </div>
                <div class="team-column">
                    <h3>Enemy Team</h3>
                    <div class="player-list" id="teamB"></div>
                </div>
            </div>

            <div id="game-summary">
            </div>

        </section>

    </main>

    <script src="welcomeButton.js"></script>
    <script src="playTextToSpeech.js"></script>
    <script src="buildPlayerCard.js"></script>
    <script src="askGameAdvice.js"></script>
    <script src="gameEndAndStart.js"></script>
    <script src="updateGame.js"></script>
    <script src="llmPrompt.js"></script>
    <script>
        let failCount = 0;
        async function fetchGameState() {
            try {
                const response = await fetch('http://127.0.0.1:5000/liveclientdata/allgamedata');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();

                if (!window.leagueAssist.activeSummonerName) {
                    failCount = 0;
                    onGameStart(data);
                }

                await updateGame(data);
            } catch (error) {
                failCount++;
                if (failCount > 2 && window.leagueAssist.activeSummonerName) {
                    await onGameEnded();
                }
                console.error(error);
            }
            setTimeout(fetchGameState, 5000);
        }

        fetchGameState();
    </script>
</body>
</html>
